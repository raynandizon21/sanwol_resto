<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurant API</title>
  <style>
    body {
      margin: 0;
      padding: 32px;
      font-family: Arial, sans-serif;
      background: #f6f8fa;
      color: #1f2328;
    }
    .card {
      max-width: 760px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 10px;
      padding: 24px;
    }
    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 24px;
    }
    p {
      margin: 0 0 14px;
      line-height: 1.45;
    }
    code {
      background: #f3f4f6;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Restaurant Management System API</h1>
    <p>API server is running.</p>
    <p>Docs endpoint: <code>/api</code></p>
  </main>
</body>
</html>
